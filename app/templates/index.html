<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send Mail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; }
    .mail-card { max-width: 640px; margin: 48px auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card mail-card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Send Mail as {{ mail_from }}</h1>

        {% if success %}
        <div class="alert alert-success" role="alert">{{ success }}</div>
        {% endif %}
        {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/send">
          <div class="mb-3">
            <label for="to" class="form-label">To</label>
            <input type="text" class="form-control" id="to" name="to" placeholder="someone@example.com, another@example.com" value="{{ form.to if form else '' }}" required>
            <div class="form-text">Comma-separate multiple addresses.</div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="cc" class="form-label">CC <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="cc" name="cc" value="{{ form.cc if form else '' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label for="bcc" class="form-label">BCC <span class="text-muted">(optional)</span></label>
              <input type="text" class="form-control" id="bcc" name="bcc" value="{{ form.bcc if form else '' }}">
            </div>
          </div>

          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control" id="subject" name="subject" value="{{ form.subject if form else '' }}" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="8" required>{{ form.message if form else '' }}</textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">Send</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
